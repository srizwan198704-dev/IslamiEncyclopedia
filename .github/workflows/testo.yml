name: Android CI Test - NamazActivity Only

on:
  workflow_dispatch:
    inputs:
      activity:
        description: 'কোন Activity টেস্ট করবে?'
        required: true
        default: 'NamazActivity'
        type: choice
        options:
          - NamazActivity
          - All

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create local.properties
        run: |
          echo "api=${{ secrets.API }}" >> local.properties
          echo "tafsir=${{ secrets.TAFSIR }}" >> local.properties
          echo "text=${{ secrets.TEXT }}" >> local.properties
          echo "pdf=${{ secrets.PDF }}" >> local.properties
          echo "boyan=${{ secrets.BOYAN }}" >> local.properties
          echo "blogid=${{ secrets.BLOGID }}" >> local.properties
          echo "api2=${{ secrets.API2 }}" >> local.properties
          echo "textapi=${{ secrets.TEXTAPI }}" >> local.properties

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/book.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🧪 STEP 1: NamazActivity Direct Open + Recording
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Run NamazActivity on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: |
            PKG="com.srizwan.islamipedia"
            TARGET_ACTIVITY="NamazActivity"

            # বুট নিশ্চিত
            adb wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done; echo "Boot OK"'
            adb shell input keyevent 82
            adb shell input keyevent 3
            sleep 3

            # ── Debug APK build ও install ──────────────────────
            echo "📦 Building Debug APK..."
            ./gradlew assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            echo "✅ APK installed"
            sleep 2

            # ── Screen Recording শুরু ──────────────────────────
            echo "📹 Screen recording started for ${TARGET_ACTIVITY}"
            adb shell screenrecord --time-limit 180 /sdcard/namaz_activity_test.mp4 &
            sleep 2

            # ══════════════════════════════════════════════════
            # [Single] NamazActivity - Direct Open
            # ══════════════════════════════════════════════════
            echo "━━━ Opening NamazActivity Directly ━━━"
            adb shell am start -n "${PKG}/.${TARGET_ACTIVITY}"
            sleep 5
            
            # UI Interaction for NamazActivity
            echo "Swiping and testing UI..."
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input swipe 720 600 720 1800 500
            sleep 2
            adb shell input swipe 720 1200 720 400 500
            sleep 2
            adb shell input tap 720 800
            sleep 2
            adb shell input swipe 720 1800 720 600 500
            sleep 2

            echo "✅ NamazActivity Test Complete - staying 5s for view"
            sleep 5

            # ── Recording বন্ধ ─────────────────────────────────
            echo "⏹ Stopping recording..."
            adb shell pkill -2 screenrecord || true
            sleep 5
            adb pull /sdcard/namaz_activity_test.mp4 . || echo "❌ Video pull failed"
            ls -lh namaz_activity_test.mp4 || echo "Video not found"

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🧪 STEP 2: Espresso Unit Tests
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Run Espresso Unit Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            ./gradlew connectedDebugAndroidTest || echo "⚠ Tests completed with some failures."

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 📦 Artifacts
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Upload Screen Recording
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: namaz-activity-video
          path: namaz_activity_test.mp4

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/androidTests/

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🔥 Release Builds
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🔍 16KB Page Size Check
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils unzip

      - name: Extract AAB
        run: unzip app/build/outputs/bundle/release/app-release.aab -d aab_check

      - name: List .so files
        run: find aab_check -name "*.so"

      - name: Check page size report
        run: |
          find aab_check -name "*.so" -exec sh -c '
            echo "---- $1 ----"
            readelf -l "$1" | grep LOAD
          ' _ {} \;

      - name: Fail if 4KB page size detected
        run: |
          if find aab_check -name "*.so" -exec readelf -l {} \; | grep -q "0x1000"; then
            echo "❌ ERROR: Found 4KB page size (0x1000). Not allowed!"
            exit 1
          else
            echo "✅ SUCCESS: All native libraries are 16KB compatible (0x4000)"
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: islamipedia-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: islamipedia-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
