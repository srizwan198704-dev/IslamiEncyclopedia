name: Android CI Test

on:
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create local.properties
        run: |
          echo "api=${{ secrets.API }}" >> local.properties
          echo "tafsir=${{ secrets.TAFSIR }}" >> local.properties
          echo "text=${{ secrets.TEXT }}" >> local.properties
          echo "pdf=${{ secrets.PDF }}" >> local.properties
          echo "boyan=${{ secrets.BOYAN }}" >> local.properties
          echo "blogid=${{ secrets.BLOGID }}" >> local.properties
          echo "api2=${{ secrets.API2 }}" >> local.properties
          echo "textapi=${{ secrets.TEXTAPI }}" >> local.properties

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/book.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🧪 STEP 1: Full UI Walkthrough + Screen Recording
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Run Full UI Walkthrough on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: |
            PKG="com.srizwan.islamipedia"

            # বুট নিশ্চিত
            adb wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done; echo "Boot OK"'
            adb shell input keyevent 82
            adb shell input keyevent 3
            sleep 3

            # ── Debug APK build ও install ──────────────────────
            echo "📦 Building Debug APK..."
            ./gradlew assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            echo "✅ APK installed"
            sleep 2

            # ── Screen Recording শুরু ──────────────────────────
            echo "📹 Screen recording started"
            adb shell screenrecord --time-limit 180 /sdcard/ui_test_recording.mp4 &
            sleep 2

            # ══════════════════════════════════════════════════
            # [1] MainActivity
            # ══════════════════════════════════════════════════
            echo "━━━ [1/20] MainActivity ━━━"
            adb shell am start -n "${PKG}/.MainActivity"
            sleep 5
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input swipe 720 600 720 1800 500
            sleep 2
            adb shell input swipe 0 1280 600 1280 600
            sleep 3
            adb shell input keyevent 4
            sleep 2

            # ══════════════════════════════════════════════════
            # [2] AlquranActivity
            # ══════════════════════════════════════════════════
            echo "━━━ [2/20] AlquranActivity ━━━"
            adb shell am start -n "${PKG}/.AlquranActivity"
            sleep 4
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input tap 720 400
            sleep 4
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input keyevent 4
            sleep 2
            adb shell input keyevent 4
            sleep 2

            # ══════════════════════════════════════════════════
            # [3] QuranActivity
            # ══════════════════════════════════════════════════
            echo "━━━ [3/20] QuranActivity ━━━"
            adb shell am start -n "${PKG}/.QuranActivity"
            sleep 4
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input swipe 720 600 720 1800 500
            sleep 2
            adb shell input keyevent 4
            sleep 2

            # ══════════════════════════════════════════════════
            # [4] HadisActivity
            # ══════════════════════════════════════════════════
            echo "━━━ [4/20] HadisActivity ━━━"
            adb shell am start -n "${PKG}/.HadisActivity"
            sleep 4
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input tap 720 500
            sleep 4
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input keyevent 4
            sleep 2
            adb shell input keyevent 4
            sleep 2

            # ══════════════════════════════════════════════════
            # [5] HadithBookActivity
            # ══════════════════════════════════════════════════
            echo "━━━ [5/20] HadithBookActivity ━━━"
            adb shell am start -n "${PKG}/.HadithBookActivity"
            sleep 4
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input tap 720 600
            sleep 4
            adb shell input keyevent 4
            sleep 2
            adb shell input keyevent 4
            sleep 2

            # ══════════════════════════════════════════════════
            # [6] NamazActivity
            # ══════════════════════════════════════════════════
            echo "━━━ [6/20] NamazActivity ━━━"
            adb shell am start -n "${PKG}/.NamazActivity"
            sleep 4
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input swipe 720 600 720 1800 500
            sleep 2
            adb shell input keyevent 4
            sleep 2

            # ══════════════════════════════════════════════════
            # [7] NamazTimeTableActivity
            # ══════════════════════════════════════════════════
            echo "━━━ [7/20] NamazTimeTableActivity ━━━"
            adb shell am start -n "${PKG}/.NamazTimeTableActivity"
            sleep 5
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input swipe 720 600 720 1800 500
            sleep 2
            adb shell input keyevent 4
            sleep 2

            # ══════════════════════════════════════════════════
            # [8] SehriIftarActivity
            # ══════════════════════════════════════════════════
            echo "━━━ [8/20] SehriIftarActivity ━━━"
            adb shell am start -n "${PKG}/.SehriIftarActivity"
            sleep 4
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input swipe 720 600 720 1800 500
            sleep 2
            adb shell input keyevent 4
            sleep 2

            # ══════════════════════════════════════════════════
            # [9] CompassActivity — swipe duration ছাড়া (3 arg)
            # ══════════════════════════════════════════════════
            echo "━━━ [9/20] CompassActivity ━━━"
            adb shell am start -n "${PKG}/.CompassActivity"
            sleep 5
            adb shell input swipe 720 1280 900 900
            sleep 2
            adb shell input swipe 720 1280 500 900
            sleep 2
            adb shell input keyevent 4
            sleep 2

            # ══════════════════════════════════════════════════
            # [10] TasbihActivity — loop ছাড়া ১০ বার tap
            # ══════════════════════════════════════════════════
            echo "━━━ [10/20] TasbihActivity ━━━"
            adb shell am start -n "${PKG}/.TasbihActivity"
            sleep 4
            adb shell input tap 720 1280
            sleep 0.4
            adb shell input tap 720 1280
            sleep 0.4
            adb shell input tap 720 1280
            sleep 0.4
            adb shell input tap 720 1280
            sleep 0.4
            adb shell input tap 720 1280
            sleep 0.4
            adb shell input tap 720 1280
            sleep 0.4
            adb shell input tap 720 1280
            sleep 0.4
            adb shell input tap 720 1280
            sleep 0.4
            adb shell input tap 720 1280
            sleep 0.4
            adb shell input tap 720 1280
            sleep 2
            adb shell input keyevent 4
            sleep 2

            # ══════════════════════════════════════════════════
            # [11] DuaActivity
            # ══════════════════════════════════════════════════
            echo "━━━ [11/20] DuaActivity ━━━"
            adb shell am start -n "${PKG}/.DuaActivity"
            sleep 4
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input tap 720 500
            sleep 4
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input keyevent 4
            sleep 2
            adb shell input keyevent 4
            sleep 2

            # ══════════════════════════════════════════════════
            # [12] BlogActivity
            # ══════════════════════════════════════════════════
            echo "━━━ [12/20] BlogActivity ━━━"
            adb shell am start -n "${PKG}/.BlogActivity"
            sleep 5
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input tap 720 500
            sleep 5
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input keyevent 4
            sleep 2
            adb shell input keyevent 4
            sleep 2

            # ══════════════════════════════════════════════════
            # [13] BoyanActivity
            # ══════════════════════════════════════════════════
            echo "━━━ [13/20] BoyanActivity ━━━"
            adb shell am start -n "${PKG}/.BoyanActivity"
            sleep 4
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input tap 720 500
            sleep 4
            adb shell input keyevent 4
            sleep 2
            adb shell input keyevent 4
            sleep 2

            # ══════════════════════════════════════════════════
            # [14] PdfActivity
            # ══════════════════════════════════════════════════
            echo "━━━ [14/20] PdfActivity ━━━"
            adb shell am start -n "${PKG}/.PdfActivity"
            sleep 4
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input swipe 720 600 720 1800 500
            sleep 2
            adb shell input keyevent 4
            sleep 2

            # ══════════════════════════════════════════════════
            # [15] TafsironlineActivity
            # ══════════════════════════════════════════════════
            echo "━━━ [15/20] TafsironlineActivity ━━━"
            adb shell am start -n "${PKG}/.TafsironlineActivity"
            sleep 5
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input tap 720 500
            sleep 5
            adb shell input keyevent 4
            sleep 2
            adb shell input keyevent 4
            sleep 2

            # ══════════════════════════════════════════════════
            # [16] SettingsActivity
            # ══════════════════════════════════════════════════
            echo "━━━ [16/20] SettingsActivity ━━━"
            adb shell am start -n "${PKG}/.SettingsActivity"
            sleep 4
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input tap 720 600
            sleep 2
            adb shell input tap 720 800
            sleep 2
            adb shell input keyevent 4
            sleep 2

            # ══════════════════════════════════════════════════
            # [17] ChangeLocationActivity
            # ══════════════════════════════════════════════════
            echo "━━━ [17/20] ChangeLocationActivity ━━━"
            adb shell am start -n "${PKG}/.ChangeLocationActivity"
            sleep 4
            adb shell input tap 720 300
            sleep 2
            adb shell input text "Dhaka"
            sleep 3
            adb shell input tap 720 600
            sleep 3
            adb shell input keyevent 4
            sleep 2

            # ══════════════════════════════════════════════════
            # [18] DonateActivity
            # ══════════════════════════════════════════════════
            echo "━━━ [18/20] DonateActivity ━━━"
            adb shell am start -n "${PKG}/.DonateActivity"
            sleep 4
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input swipe 720 600 720 1800 500
            sleep 2
            adb shell input keyevent 4
            sleep 2

            # ══════════════════════════════════════════════════
            # [19] DownloadActivity
            # ══════════════════════════════════════════════════
            echo "━━━ [19/20] DownloadActivity ━━━"
            adb shell am start -n "${PKG}/.DownloadActivity"
            sleep 4
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input swipe 720 600 720 1800 500
            sleep 2
            adb shell input keyevent 4
            sleep 2

            # ══════════════════════════════════════════════════
            # [20] MainActivity — Final Bottom Nav
            # ══════════════════════════════════════════════════
            echo "━━━ [20/20] MainActivity Final ━━━"
            adb shell am start -n "${PKG}/.MainActivity"
            sleep 4
            adb shell input tap 288 2450
            sleep 3
            adb shell input tap 576 2450
            sleep 3
            adb shell input tap 864 2450
            sleep 3
            adb shell input tap 1152 2450
            sleep 3
            adb shell input swipe 0 1280 600 1280 600
            sleep 3
            adb shell input swipe 720 1800 720 600 500
            sleep 2
            adb shell input keyevent 4
            sleep 2

            # ── Recording বন্ধ ─────────────────────────────────
            echo "⏹ Stopping recording..."
            sleep 3
            adb shell pkill -2 screenrecord || true
            sleep 5
            adb pull /sdcard/ui_test_recording.mp4 . || echo "❌ Video pull failed"
            echo "✅ Walkthrough complete!"

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🧪 STEP 2: Espresso Unit Tests
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Run Espresso Unit Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            ./gradlew connectedDebugAndroidTest || echo "⚠️ Tests completed with some failures."

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 📦 Artifacts
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Upload Screen Recording
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-ui-walkthrough-video
          path: ui_test_recording.mp4

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/androidTests/

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🔥 Release Builds
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🔍 16KB Page Size Check
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils unzip

      - name: Extract AAB
        run: unzip app/build/outputs/bundle/release/app-release.aab -d aab_check

      - name: List .so files
        run: find aab_check -name "*.so"

      - name: Check page size report
        run: |
          find aab_check -name "*.so" -exec sh -c '
            echo "---- $1 ----"
            readelf -l "$1" | grep LOAD
          ' _ {} \;

      - name: Fail if 4KB page size detected
        run: |
          if find aab_check -name "*.so" -exec readelf -l {} \; | grep -q "0x1000"; then
            echo "❌ ERROR: Found 4KB page size (0x1000). Not allowed!"
            exit 1
          else
            echo "✅ SUCCESS: All native libraries are 16KB compatible (0x4000)"
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: islamipedia-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: islamipedia-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
