name: Android CI Test

on:
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create local.properties
        run: |
          echo "api=${{ secrets.API }}" >> local.properties
          echo "tafsir=${{ secrets.TAFSIR }}" >> local.properties
          echo "text=${{ secrets.TEXT }}" >> local.properties
          echo "pdf=${{ secrets.PDF }}" >> local.properties
          echo "boyan=${{ secrets.BOYAN }}" >> local.properties
          echo "blogid=${{ secrets.BLOGID }}" >> local.properties
          echo "api2=${{ secrets.API2 }}" >> local.properties
          echo "textapi=${{ secrets.TEXTAPI }}" >> local.properties

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/book.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🧪 MAIN: Emulator boot → APK install → Full UI Walkthrough
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Run Full UI Walkthrough on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          pre-adb-setup: |
            adb shell input keyevent 82
          script: |
            # ─── Helper functions ───────────────────────────────
            PKG="com.srizwan.islamipedia"
            W=1440   # screen width  (Nexus 6: 1440x2560)
            H=2560   # screen height
            CX=720   # center X
            CY=1280  # center Y

            tap()    { adb shell input tap "$1" "$2"; }
            swipe_up()   { adb shell input swipe $CX 1800 $CX 600 500; }
            swipe_down() { adb shell input swipe $CX 600 $CX 1800 500; }
            back()   { adb shell input keyevent 4; }
            home()   { adb shell input keyevent 3; }
            wait()   { sleep "$1"; }
            launch() { adb shell am start -n "$PKG/$1"; wait 4; }
            log()    { echo ""; echo "━━━ $1 ━━━"; }

            # ─── Device ready ────────────────────────────────────
            adb wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            adb shell input keyevent 82
            adb shell input keyevent 3
            wait 2

            # ─── Build & Install Debug APK ────────────────────────
            log "Building Debug APK..."
            ./gradlew assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            log "✅ APK installed"

            # ─── Screen Recording শুরু ────────────────────────────
            log "📹 Screen recording started"
            adb shell screenrecord --time-limit 180 /sdcard/ui_test_recording.mp4 &
            wait 2

            # ════════════════════════════════════════════════════
            # 🏠 [1] MainActivity — Splash / Home
            # ════════════════════════════════════════════════════
            log "[1/20] MainActivity — Home Screen"
            launch ".$PKG.MainActivity"
            swipe_up
            wait 2
            swipe_down
            wait 2
            # Drawer menu খোলা (বাম দিক থেকে swipe)
            adb shell input swipe 0 $CY 600 $CY 600
            wait 3
            back
            wait 2

 
