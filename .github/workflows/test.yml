name: Android CItest

on:
  workflow_dispatch:   # শুধু manual run

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create local.properties
        run: |
          echo "api=${{ secrets.API }}" >> local.properties
          echo "tafsir=${{ secrets.TAFSIR }}" >> local.properties
          echo "text=${{ secrets.TEXT }}" >> local.properties
          echo "pdf=${{ secrets.PDF }}" >> local.properties
          echo "boyan=${{ secrets.BOYAN }}" >> local.properties
          echo "blogid=${{ secrets.BLOGID }}" >> local.properties
          echo "api2=${{ secrets.API2 }}" >> local.properties
          echo "textapi=${{ secrets.TEXTAPI }}" >> local.properties

      - name: Decode Keystore
        run: |
          # build.gradle.kts অনুযায়ী ফাইলটি সরাসরি app/ ফোল্ডারে 'book.jks' নামে যাবে
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/book.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 🧪 [ধাপ ১]: targetSdk 36 এর সাথে সামঞ্জস্য রেখে Emulator রান ও স্ক্রিন রেকর্ড
      - name: Run UI Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34           # targetSdk 36 এর কাছাকাছি এবং স্টেবল এপিআই ৩৪ ব্যবহার করা হয়েছে
          target: google_apis
          arch: x86_64            # গ্রেডল ফাইলের ndk filter (x86_64) এর সাথে হুবহু মিল রাখা হয়েছে
          profile: Nexus 6
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          script: |
            echo "Starting Screen Recording in background..."
            # ব্যাকগ্রাউন্ডে ভিডিও রেকর্ড চালু করা
            adb shell screenrecord /sdcard/ui_test_recording.mp4 &
            
            echo "Running Espresso UI Tests..."
            # টেস্ট রান করা এবং ফেইল করলেও স্ক্রিপ্ট যেন পরের ধাপে গিয়ে ভিডিও সেভ করে
            ./gradlew connectedDebugAndroidTest || echo "⚠️ Tests completed with failures, processing video..."
            
            echo "Stopping Screen Recording..."
            sleep 2
            adb shell pkill -2 screenrecord || true
            sleep 5
            
            echo "Pulling video from Emulator..."
            adb pull /sdcard/ui_test_recording.mp4 . || echo "❌ Video pull failed"

      # 📦 [ধাপ ২]: টেস্টের স্ক্রিন রেকর্ডিং ভিডিও আপলোড (টেস্ট পাস বা ফেইল যাই হোক)
      - name: Upload Test Screen Recording Video
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screen-recording
          path: ui_test_recording.mp4

      # 🔥 Build APK (Release)
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 🔥 Build AAB (Release)
      - name: Build Release AAB
        run: ./gradlew bundleRelease

      # ✅ Install tools for checking native libs
      - name: Install binutils (readelf)
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils unzip

      # 🔍 Extract AAB
      - name: Extract AAB
        run: |
          unzip app/build/outputs/bundle/release/app-release.aab -d aab_check

      # 🔍 Show all native libs
      - name: List .so files
        run: |
          find aab_check -name "*.so"

      # 🔍 Detailed page size report
      - name: Check page size (report)
        run: |
          find aab_check -name "*.so" -exec sh -c '
            echo "---- $1 ----";
            readelf -l "$1" | grep LOAD
          ' _ {} \;

      # ❌ Auto fail if 4KB found
      - name: Fail if 4KB page size detected
        run: |
          if find aab_check -name "*.so" -exec readelf -l {} \; | grep -q "0x1000"; then
            echo "❌ ERROR: Found 4KB page size (0x1000). Not allowed!"
            exit 1
          else
            echo "✅ SUCCESS: All native libraries are 16KB compatible (0x4000)"
          fi

      # 📦 Upload Final Build Artifacts
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: islamipedia-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: islamipedia-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
