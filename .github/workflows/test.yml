name: Android CI Test

on:
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create local.properties
        run: |
          echo "api=${{ secrets.API }}" >> local.properties
          echo "tafsir=${{ secrets.TAFSIR }}" >> local.properties
          echo "text=${{ secrets.TEXT }}" >> local.properties
          echo "pdf=${{ secrets.PDF }}" >> local.properties
          echo "boyan=${{ secrets.BOYAN }}" >> local.properties
          echo "blogid=${{ secrets.BLOGID }}" >> local.properties
          echo "api2=${{ secrets.API2 }}" >> local.properties
          echo "textapi=${{ secrets.TEXTAPI }}" >> local.properties

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/book.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ✅ Enable KVM hardware acceleration (speeds up emulator significantly)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 🧪 Run UI Tests on Android Emulator
      - name: Run UI Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 29 is more compatible with x86_64 and modern AGP
          api-level: 29
          target: default
          # x86_64 avoids "0 compatible devices" ABI mismatch with modern builds
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          # pre-adb-setup runs AFTER boot but BEFORE the script — use it to unlock screen
          pre-adb-setup: |
            adb shell input keyevent 82
          script: |
            echo "✅ Emulator is ready. Verifying device..."
            adb devices -l

            # Double-check the device is fully booted before proceeding
            echo "Waiting for sys.boot_completed..."
            adb wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done; echo "Boot confirmed"'

            echo "Starting screen recording in background..."
            adb shell screenrecord /sdcard/ui_test_recording.mp4 &
            RECORD_PID=$!

            echo "Running Espresso UI Tests..."
            ./gradlew connectedDebugAndroidTest || echo "⚠️ Tests completed with some failures."

            echo "Stopping screen recording..."
            sleep 2
            adb shell pkill -2 screenrecord || true
            sleep 5

            echo "Pulling video from emulator..."
            adb pull /sdcard/ui_test_recording.mp4 . || echo "❌ Video pull failed"

      # 📦 Upload test screen recording
      - name: Upload Test Screen Recording
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screen-recording
          path: ui_test_recording.mp4

      # 📋 Upload test reports (HTML report with pass/fail details)
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/androidTests/

      # 🔥 Build Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 🔥 Build Release AAB
      - name: Build Release AAB
        run: ./gradlew bundleRelease

      # ✅ Install tools for native lib checking
      - name: Install binutils (readelf)
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils unzip

      # 🔍 Extract and inspect AAB for page size compliance
      - name: Extract AAB
        run: |
          unzip app/build/outputs/bundle/release/app-release.aab -d aab_check

      - name: List .so files
        run: |
          find aab_check -name "*.so"

      - name: Check page size (report)
        run: |
          find aab_check -name "*.so" -exec sh -c '
            echo "---- $1 ----"
            readelf -l "$1" | grep LOAD
          ' _ {} \;

      # ❌ Fail if 4KB page size detected (Play Store requirement)
      - name: Fail if 4KB page size detected
        run: |
          if find aab_check -name "*.so" -exec readelf -l {} \; | grep -q "0x1000"; then
            echo "❌ ERROR: Found 4KB page size (0x1000). Not allowed!"
            exit 1
          else
            echo "✅ SUCCESS: All native libraries are 16KB compatible (0x4000)"
          fi

      # 📦 Upload final artifacts
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: islamipedia-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: islamipedia-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
