name: Android CI - Build Rename Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rename-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create local.properties
        run: |
          echo "api=${{ secrets.API }}" >> local.properties
          echo "tafsir=${{ secrets.TAFSIR }}" >> local.properties
          echo "text=${{ secrets.TEXT }}" >> local.properties
          echo "pdf=${{ secrets.PDF }}" >> local.properties
          echo "boyan=${{ secrets.BOYAN }}" >> local.properties
          echo "blogid=${{ secrets.BLOGID }}" >> local.properties
          echo "api2=${{ secrets.API2 }}" >> local.properties
          echo "textapi=${{ secrets.TEXTAPI }}" >> local.properties

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/book.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      - name: Install binutils and apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils unzip apktool apksigner zipalign default-jdk aapt

      - name: Check 16KB Page Size
        run: |
          unzip app/build/outputs/bundle/release/app-release.aab -d aab_check
          find aab_check -name "*.so" -exec sh -c 'echo "---- $1 ----"; readelf -l "$1" | grep LOAD' _ {} \;
          if find aab_check -name "*.so" -exec readelf -l {} \; | grep -q "0x1000"; then
            echo "ERROR: Found 4KB page size!"
            exit 1
          fi

      - name: Prepare APK for Rename
        run: |
          mkdir -p apk/output
          cp app/build/outputs/apk/release/app-release.apk apk/original.apk
          echo "apk_path=apk/original.apk" >> $GITHUB_ENV

      - name: Decode APK
        run: |
          apktool d ${{ env.apk_path }} -o apk/decoded -f

      - name: Change Package Name Only in AndroidManifest.xml
        run: |
          NEW_PACKAGE="com.konasl.nagad"
          MANIFEST="apk/decoded/AndroidManifest.xml"
          OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' $MANIFEST)
          echo "Old Package: $OLD_PACKAGE"
          echo "New Package: $NEW_PACKAGE"
          # শুধু AndroidManifest.xml এর package attribute চেঞ্জ হবে
          sed -i "s/package=\"$OLD_PACKAGE\"/package=\"$NEW_PACKAGE\"/" "$MANIFEST"
          echo "Manifest Updated:"
          grep -oP 'package="[^"]+' "$MANIFEST"

      - name: Rebuild and Sign Renamed APK
        run: |
          apktool b apk/decoded -o apk/output/unsigned.apk
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          zipalign -v 4 apk/output/unsigned.apk apk/output/aligned.apk
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out apk/output/com.konasl.nagad.apk apk/output/aligned.apk
          aapt dump badging apk/output/com.konasl.nagad.apk | grep package
          ls -lh apk/output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-${{ github.run_number }}-${{ github.run_id }}
          name: "IslamiPedia Build ${{ github.run_number }}"
          body: |
            ✅ Original APK + AAB (original package)
            ✅ Renamed APK (only Manifest package changed to com.konasl.nagad)
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            apk/output/com.konasl.nagad.apk
