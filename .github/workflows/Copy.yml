<-----
name: Sync JSON Books to Assets

on:
  workflow_dispatch: # আপনি নিজে Run button চাপলে চলবে
  schedule:
    - cron: '0 18 * * *' # প্রতিদিন রাত 12 টা BD time এ auto sync হবে, চাইলে বাদ দিতে পারেন
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-books:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo (IslamiEncyclopedia)
        uses: actions/checkout@v4

      - name: Clone Source Repo SunniPedia/PdfTxtJson
        run: |
          git clone --depth 1 https://github.com/SunniPedia/PdfTxtJson.git /tmp/PdfTxtJson
          ls -R /tmp/PdfTxtJson | head -n 100

      - name: Copy all JSON files to assets/books
        run: |
          # Destination folder
          DEST="app/src/main/assets/books"
          mkdir -p "$DEST"

          # Source 1: /json/*.json
          SRC1="/tmp/PdfTxtJson/json"
          # Source 2: /Kanzuliman /KhazaiNulirfan/*.json -> লক্ষ্য করুন ফোল্ডার নামে space আছে
          SRC2="/tmp/PdfTxtJson/Kanzuliman /KhazaiNulirfan"

          echo "Copying from $SRC1"
          if [ -d "$SRC1" ]; then
            find "$SRC1" -maxdepth 1 -type f -name "*.json" -exec cp -v {} "$DEST"/ \;
          fi

          echo "Copying from $SRC2 excluding text.json"
          if [ -d "$SRC2" ]; then
            find "$SRC2" -maxdepth 1 -type f -name "*.json"! -name "text.json" -exec cp -v {} "$DEST"/ \;
          fi

          echo "Total files in destination:"
          ls -lh "$DEST" | wc -l
          ls -lh "$DEST"

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add app/src/main/assets/books/*.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync json books from SunniPedia/PdfTxtJson - $(date +'%Y-%m-%d')"
            git push
          fi
          ------>
