name: Android CI Test - Screen Record Only

on:
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create local.properties
        run: |
          echo "api=${{ secrets.API }}" >> local.properties
          echo "tafsir=${{ secrets.TAFSIR }}" >> local.properties
          echo "text=${{ secrets.TEXT }}" >> local.properties
          echo "pdf=${{ secrets.PDF }}" >> local.properties
          echo "boyan=${{ secrets.BOYAN }}" >> local.properties
          echo "blogid=${{ secrets.BLOGID }}" >> local.properties
          echo "api2=${{ secrets.API2 }}" >> local.properties
          echo "textapi=${{ secrets.TEXTAPI }}" >> local.properties

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/book.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 📹 ONLY Screen Recording - No Activity Walkthrough
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Screen Record Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: |
            PKG="com.srizwan.islamipedia"

            echo "⏳ Waiting for emulator boot..."
            adb wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done; echo "Boot OK"'
            adb shell input keyevent 82
            adb shell input keyevent 3
            sleep 3

            echo "📦 Building Debug APK..."
            ./gradlew assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            echo "✅ APK installed"
            sleep 2

            echo "📹 Starting screen recording..."
            adb shell screenrecord --time-limit 120 /sdcard/app_record.mp4 &
            RECORD_PID=$!
            sleep 2

            echo "🚀 Launching App (MainActivity)..."
            adb shell am start -n "${PKG}/.MainActivity"
            sleep 15

            echo "📱 App is open, recording for 15s..."
            sleep 15

            echo "⏹ Stopping recording..."
            adb shell pkill -2 screenrecord || true
            sleep 5
            adb pull /sdcard/app_record.mp4 . || echo "❌ Video pull failed"
            ls -lh app_record.mp4

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 📦 Artifacts
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Upload Screen Recording
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-record-video
          path: app_record.mp4
